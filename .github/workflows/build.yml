name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release x64)
        run: msbuild FeedKit.sln /p:Configuration=Release /p:Platform=x64 /m /nologo /v:m

      # Activates automatically once SignPath Foundation approves the project
      # and the repo secrets/variables are configured (see docs/ANTIVIRUS.md).
      - name: Sign with SignPath (skipped until configured)
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          Install-Module -Name SignPath -Force -Scope CurrentUser
          Submit-SigningRequest `
            -InputFile build/Release/FeedKit.exe `
            -OutputFile build/Release/FeedKit-signed.exe `
            -Url "https://app.signpath.io/API/v1/$env:SIGNPATH_ORGANIZATION_ID" `
            -Token $env:SIGNPATH_API_TOKEN `
            -ProjectSlug $env:SIGNPATH_PROJECT_SLUG `
            -SigningPolicySlug $env:SIGNPATH_SIGNING_POLICY_SLUG `
            -WaitForCompletion
          Move-Item build/Release/FeedKit-signed.exe build/Release/FeedKit.exe -Force

      - name: Print SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash build/Release/FeedKit.exe -Algorithm SHA256).Hash
          "FeedKit.exe SHA-256: $hash" | Tee-Object -Variable sha | Write-Output
          "SHA256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeedKit-win-x64
          path: build/Release/FeedKit.exe
          if-no-files-found: error
